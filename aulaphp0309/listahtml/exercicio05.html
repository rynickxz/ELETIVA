<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4 bg-light p-3" style="max-width: 520px;">

        <h1 class="fs-4 fw-bold mb-4">Billing address</h1>

        <form>

            <div class="row">

                <div class="col-md-6">
                    <label class="form-label">First name</label>
                    <input type="text" class="form-control">
                </div>

                <div class="col-md-6">
                    <label class="form-label">Last name</label>
                    <input type="text" class="form-control">
                </div>

            </div>

            <div class="mt-3">
                <label class="form-label">Username</label>

                <div class="input-group">
                    <span class="input-group-text">@</span>
                    <input type="text" class="form-control" placeholder="Username">
                </div>
            </div>

            <div class="mt-3">
                <label class="form-label">Email (Optional)</label>
                <input type="email" class="form-control" placeholder="you@example.com">
            </div>

            <div class="mt-3">
                <label class="form-label">Address</label>
                <input type="text" class="form-control" placeholder="1234 Main St">
            </div>

            <div class="mt-3">
                <label class="form-label">Address 2 (Optional)</label>
                <input type="text" class="form-control" placeholder="Apartment or suite">
            </div>

            <div class="row mt-3">

                <div class="col-md-6">
                    <label class="form-label">Country</label>
                    <select class="form-select">
                        <option>Choose...</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">State</label>
                    <select class="form-select">
                        <option>Choose...</option>
                    </select>
                </div>

                <div class="col-md-2">
                    <label class="form-label">Zip</label>
                    <input type="text" class="form-control">
                </div>

            </div>

        </form>

    </div>

</body>

</html>
