<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container-fluid">

        <h1 class="mt-3">Novo Usuário</h1>

        <form>

            <div class="row mt-4">

                <div class="col-md-10 offset-md-2">
                    <label class="form-label">Nome:</label>
                    <input type="text" class="form-control" placeholder="Informe o nome...">
                </div>

            </div>

            <div class="row mt-3">

                <div class="col-md-2 offset-md-2">
                    <label class="form-label">CPF:</label>
                    <input type="text" class="form-control" placeholder="Informe o cpf...">
                </div>

                <div class="col-md-5">
                    <label class="form-label">Endereço:</label>
                    <input type="text" class="form-control" placeholder="Informe o endereço...">
                </div>

                <div class="col-md-2">
                    <label class="form-label">Nível:</label>
                    <select class="form-select">
                        <option>--</option>
                    </select>
                </div>

            </div>

            <div class="row mt-3">

                <div class="col-md-4 offset-md-2">
                    <label class="form-label">Email:</label>
                    <input type="email" class="form-control" placeholder="Informe o email...">
                </div>

                <div class="col-md-3">
                    <label class="form-label">Senha:</label>
                    <input type="password" class="form-control" placeholder="Informe a senha...">
                </div>

                <div class="col-md-2">
                    <label class="form-label">Status:</label>
                    <select class="form-select">
                        <option>--</option>
                    </select>
                </div>

            </div>

            <div class="row mt-3">

                <div class="col-md-2 offset-md-10">
                    <button type="submit" class="btn btn-success">
                        Enviar
                    </button>

                    <button type="reset" class="btn btn-light border">
                        Cancelar
                    </button>
                </div>

            </div>

        </form>

    </div>

</body>

</html>
