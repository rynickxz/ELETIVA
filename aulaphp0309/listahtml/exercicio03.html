<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container">

        <h1 class="text-center fs-4 fw-bold mt-3 mb-4">
            Sample Form
        </h1>

        <form>

            <div class="row mb-3">

                <div class="col-md-2 text-end">
                    <label class="form-label">Partner Name</label>
                </div>

                <div class="col-md-4">
                    <input type="text" class="form-control">
                </div>

                <div class="col-md-2 text-end">
                    <label class="form-label">Partner Email ID</label>
                </div>

                <div class="col-md-4">
                    <input type="email" class="form-control">
                </div>

            </div>

            <div class="row mb-3">

                <div class="col-md-2 text-end">
                    <label class="form-label">Partner Legal Name</label>
                </div>

                <div class="col-md-4">
                    <input type="text" class="form-control">
                </div>

                <div class="col-md-2 text-end">
                    <label class="form-label">Partner Mobile</label>
                </div>

                <div class="col-md-4">
                    <input type="text" class="form-control">
                </div>

            </div>

            <div class="row mb-3">

                <div class="col-md-2 text-end">
                    <label class="form-label">Partner Address</label>
                </div>

                <div class="col-md-10">
                    <textarea class="form-control" rows="2"></textarea>
                </div>

            </div>

            <div class="row mb-3">

                <div class="col-md-2 text-end">
                    <label class="form-label">Contract Start Date</label>
                </div>

                <div class="col-md-4">
                    <input type="date" class="form-control">
                </div>

                <div class="col-md-2 text-end">
                    <label class="form-label">Contract Expiry Date</label>
                </div>

                <div class="col-md-4">
                    <input type="date" class="form-control">
                </div>

            </div>

            <div class="row mb-3">

                <div class="col-md-2 text-end">
                    <label class="form-label">Minimum Loan Amount</label>
                </div>

                <div class="col-md-4">
                    <input type="number" class="form-control">
                </div>

                <div class="col-md-2 text-end">
                    <label class="form-label">Maximum Loan Amount</label>
                </div>

                <div class="col-md-4">
                    <input type="number" class="form-control">
                </div>

            </div>

            <div class="row mb-3">

                <div class="col-md-2 text-end">
                    <label class="form-label">Interest Rate</label>
                </div>

                <div class="col-md-4">
                    <input type="number" class="form-control">
                </div>

                <div class="col-md-2 text-end">
                    <label class="form-label">Deposit Amount</label>
                </div>

                <div class="col-md-4">
                    <input type="number" class="form-control">
                </div>

            </div>

            <div class="text-center mt-4">
                <button type="submit" class="btn btn-primary">
                    Save
                </button>
            </div>

        </form>

    </div>

</body>

</html>
